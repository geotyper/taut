<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taut foam</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div class="fields single">
        <figure>
          <canvas id="field"></canvas>
          <canvas id="field-sheen" class="smooth" hidden></canvas>
          <p class="stat" id="stat"></p>
        </figure>
      </div>

      <aside>
        <h1>taut foam</h1>
        <p class="hint">
          Bubbles grow from their centres until they meet, and the borders
          between them are soap films: each one pulls taut, and three meet at
          equal angles. <a href="/">2D version</a>
        </p>
        <p class="hint">
          Left button starts a bubble, right button or Shift bursts one. Keys:
          <kbd>N</kbd> new centres, <kbd>A</kbd> add a centre, <kbd>Space</kbd> pause.
        </p>

        <label>
          <span>Palette</span>
          <select id="palette">
            <option value="soap">Soap film</option>
            <option value="pastel">Pastel</option>
            <option value="films">Films only</option>
            <option value="dark">Dark</option>
          </select>
        </label>

        <label class="check" id="pick-sheen">
          <input id="sheen" type="checkbox" checked />
          <span>Shimmer of a thin film</span>
        </label>

        <label>
          <span>Coarsening</span>
          <select id="coarsening">
            <option value="none">None: bubbles keep their area</option>
            <option value="seep">Gas seeps through the films</option>
            <option value="burst">Films burst</option>
            <option value="pop">Bubbles pop</option>
          </select>
        </label>
        <label id="pick-rate">
          <span>Bursts per 1000 steps <output id="rate-out"></output></span>
          <input id="rate" type="range" min="1" max="100" step="1" value="10" />
        </label>

        <label>
          <span>Field size</span>
          <select id="field-size">
            <option value="320">320 × 320</option>
            <option value="512">512 × 512</option>
            <option value="768">768 × 768</option>
            <option value="1024">1024 × 1024</option>
          </select>
        </label>
        <label>
          <span>Kernel radius <output id="radius-out"></output></span>
          <input id="radius" type="range" min="2" max="10" step="1" value="6" />
        </label>
        <label>
          <span>Noise <output id="noise-out"></output></span>
          <input id="noise" type="range" min="0" max="0.5" step="0.01" value="0.1" />
        </label>
        <label>
          <span>Steps per frame <output id="speed-out"></output></span>
          <input id="speed" type="range" min="1" max="32" step="1" value="1" />
        </label>

        <h2>Centres</h2>
        <label>
          <span>Count <output id="count-out"></output></span>
          <input id="count" type="range" min="2" max="2000" step="1" value="40" />
        </label>
        <label>
          <span>Size of a new bubble <output id="brush-out"></output></span>
          <input id="brush" type="range" min="4" max="30" step="1" value="10" />
        </label>

        <div class="buttons">
          <button id="random">New centres</button>
          <button id="add">Add a centre</button>
          <button id="pause">Pause</button>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/foam/main.ts"></script>
  </body>
</html>

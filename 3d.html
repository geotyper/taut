<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taut 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div class="fields single">
        <figure>
          <canvas id="field-3d" class="orbit"></canvas>
          <p class="stat" id="stat-3d"></p>
        </figure>
      </div>

      <aside>
        <h1>taut 3D</h1>
        <p class="hint">
          Drag to orbit, drag with the right button or Shift to move the view, scroll to zoom, double-click to centre it again. <a href="/">2D version</a>
        </p>
        <p class="hint">
          Keys: <kbd>O</kbd> opaque, <kbd>C</kbd> one colour, <kbd>S</kbd> smooth
          or voxels, <kbd>N</kbd> new stones, <kbd>A</kbd> add a stone, <kbd>R</kbd> restart,
          <kbd>Space</kbd> pause.
        </p>

        <div class="buttons">
          <button id="random">New stones</button>
          <button id="add-stone">Add a stone</button>
        </div>

        <label>
          <span>Automaton</span>
          <select id="automaton">
            <option value="lines">Line majority (pulls taut)</option>
            <option value="film">Wide kernel (soap film)</option>
            <option value="clusters">Clusters (a membrane per group)</option>
          </select>
        </label>

        <section id="group-lines">
          <h2>Line majority</h2>
          <label id="pick-kernel">
            <span>Kernel</span>
            <select id="kernel">
              <option value="thin">Thin lines</option>
              <option value="soft">Soft lines (smoother)</option>
            </select>
          </label>
          <label>
            <span>Line reach <output id="lines-radius-out"></output></span>
            <input id="lines-radius" type="range" min="4" max="40" step="1" value="10" />
          </label>
          <label id="pick-pressure">
            <span>Pressure <output id="pressure-out"></output></span>
            <input id="pressure" type="range" min="-1" max="1" step="0.05" value="0" />
          </label>
          <label>
            <span>Noise <output id="lines-noise-out"></output></span>
            <input id="lines-noise" type="range" min="0" max="0.3" step="0.01" value="0" />
          </label>
        </section>

        <section id="group-clusters">
          <h2>Clusters</h2>
          <label>
            <span>Cluster radius <output id="cluster-reach-out"></output></span>
            <input id="cluster-reach" type="range" min="1" max="24" step="1" value="5" />
          </label>
          <label>
            <span>Padding around stones <output id="cluster-padding-out"></output></span>
            <input id="cluster-padding" type="range" min="0" max="16" step="1" value="3" />
          </label>
          <label>
            <span>Break bridges thinner than <output id="cluster-bridge-out"></output></span>
            <input id="cluster-bridge" type="range" min="0" max="32" step="1" value="0" />
          </label>
        </section>

        <section id="group-film">
          <h2>Wide kernel</h2>
          <label>
            <span>Kernel radius <output id="film-radius-out"></output></span>
            <input id="film-radius" type="range" min="1" max="12" step="1" value="3" />
          </label>
          <label>
            <span>Threshold (pressure) <output id="film-threshold-out"></output></span>
            <input id="film-threshold" type="range" min="0.48" max="0.53" step="0.001" value="0.5" />
          </label>
          <label>
            <span>Noise <output id="film-noise-out"></output></span>
            <input id="film-noise" type="range" min="0" max="0.5" step="0.01" value="0.1" />
          </label>
        </section>

        <h2>General</h2>
        <label>
          <span>Resolution</span>
          <select id="size">
            <option value="64" selected>Low (64³)</option>
            <option value="96">Medium (96³)</option>
            <option value="128">High (128³, slower)</option>
            <option value="192">Ultra (192³, slow)</option>
          </select>
        </label>
        <label id="pick-start">
          <span>Wave start</span>
          <select id="start">
            <option value="ball">Ball</option>
            <option value="cube">Whole field</option>
          </select>
        </label>
        <label>
          <span>Stones <output id="stone-count-out"></output></span>
          <input id="stone-count" type="range" min="1" max="40" step="1" value="5" />
        </label>
        <label>
          <span>Stone size <output id="stone-scale-out"></output></span>
          <input id="stone-scale" type="range" min="0.3" max="1" step="0.05" value="1" />
        </label>
        <label>
          <span>Stone spread <output id="stone-spread-out"></output></span>
          <input id="stone-spread" type="range" min="0.4" max="1" step="0.01" value="0.88" />
        </label>
        <label>
          <span>Stone placement</span>
          <select id="stone-placement">
            <option value="box">Anywhere</option>
            <option value="sphere">Mostly on a sphere</option>
            <option value="clumps">In clumps</option>
          </select>
        </label>
        <label id="pick-clumps">
          <span>Clumps <output id="stone-clumps-out"></output></span>
          <input id="stone-clumps" type="range" min="1" max="8" step="1" value="3" />
        </label>
        <label class="check">
          <input id="stone-floor" type="checkbox" />
          <span>Stones lie on a floor</span>
        </label>
        <label>
          <span>Stone shape</span>
          <select id="stone-shape">
            <option value="mixed">Mixed</option>
            <option value="sharp">All sharp</option>
            <option value="round">All rounded</option>
          </select>
        </label>
        <label>
          <span>Steps per frame <output id="speed-out"></output></span>
          <input id="speed" type="range" min="1" max="16" step="1" value="1" />
        </label>
        <label>
          <span>Surface</span>
          <select id="surface">
            <option value="voxels">Voxels</option>
            <option value="smooth">Smooth</option>
          </select>
        </label>
        <label id="group-smoothness">
          <span>Smoothness <output id="smoothness-out"></output></span>
          <input id="smoothness" type="range" min="0" max="2.5" step="0.1" value="1.2" />
        </label>
        <label>
          <span>Membrane opacity <output id="opacity-out"></output></span>
          <input id="opacity" type="range" min="0.05" max="1" step="0.01" value="0.3" />
        </label>
        <label class="check">
          <input id="opaque" type="checkbox" />
          <span>Opaque membrane</span>
        </label>
        <label class="check">
          <input id="one-color" type="checkbox" />
          <span>Stones in membrane colour</span>
        </label>

        <div class="buttons pair">
          <button id="restart">Restart the wave</button>
          <button id="pause">Pause</button>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/3d/main.ts"></script>
  </body>
</html>

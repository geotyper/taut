<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taut</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div class="fields" id="fields">
        <figure id="figure-a">
          <figcaption>
            <select id="algorithm-a" aria-label="Automaton">
              <option value="wide">Wide kernel</option>
              <option value="classic">Classic automaton</option>
              <option value="potts">Potts model</option>
              <option value="growth">Growth from stones</option>
            </select>
            <label class="check">
              <input id="friction-a" type="checkbox" />
              <span>friction</span>
            </label>
            <label class="check">
              <input id="length-a" type="checkbox" />
              <span>fixed length</span>
            </label>
          </figcaption>
          <canvas id="field-a"></canvas>
          <p class="stat" id="stat-a"></p>
        </figure>
        <figure id="figure-b">
          <figcaption>
            <select id="algorithm-b" aria-label="Automaton">
              <option value="wide">Wide kernel</option>
              <option value="classic">Classic automaton</option>
              <option value="potts">Potts model</option>
              <option value="growth">Growth from stones</option>
            </select>
            <label class="check">
              <input id="friction-b" type="checkbox" />
              <span>friction</span>
            </label>
            <label class="check">
              <input id="length-b" type="checkbox" />
              <span>fixed length</span>
            </label>
          </figcaption>
          <canvas id="field-b"></canvas>
          <p class="stat" id="stat-b"></p>
        </figure>
      </div>

      <aside>
        <h1>taut</h1>
        <p class="hint">
          Left button draws stones, right button or Shift erases. Both fields
          share the same stones. Area and length under a field are relative to
          the convex hull. <a href="/3d.html">3D version</a> ·
          <a href="/clusters.html">clusters</a> ·
          <a href="/foam.html">foam</a>
        </p>

        <label>
          <span>Mode</span>
          <select id="mode">
            <option value="compare">Compare two fields</option>
            <option value="single">Single field</option>
          </select>
        </label>

        <section id="group-wide">
          <h2>Wide kernel</h2>
          <label>
            <span>Kernel radius <output id="radius-out"></output></span>
            <input id="radius" type="range" min="1" max="16" step="1" value="5" />
          </label>
          <label>
            <span>Threshold (pressure) <output id="threshold-out"></output></span>
            <input id="threshold" type="range" min="0.48" max="0.53" step="0.001" value="0.5" />
          </label>
          <label>
            <span>Noise <output id="noise-out"></output></span>
            <input id="noise" type="range" min="0" max="0.5" step="0.01" value="0.1" />
          </label>
          <label>
            <span>Steps per frame <output id="speed-out"></output></span>
            <input id="speed" type="range" min="1" max="8" step="1" value="2" />
          </label>
        </section>

        <section id="group-classic">
          <h2>Classic automaton</h2>
          <label>
            <span>Rule</span>
            <select id="rule">
              <option value="anneal">Anneal (4 and 5 swapped)</option>
              <option value="majority">Majority (5 of 9)</option>
            </select>
          </label>
          <label>
            <span>Steps per frame <output id="classic-speed-out"></output></span>
            <input id="classic-speed" type="range" min="1" max="200" step="1" value="60" />
          </label>
        </section>

        <section id="group-potts">
          <h2>Potts model</h2>
          <label>
            <span>Temperature <output id="temperature-out"></output></span>
            <input id="temperature" type="range" min="0" max="3" step="0.05" value="0.5" />
          </label>
          <label>
            <span>Pressure <output id="potts-pressure-out"></output></span>
            <input id="potts-pressure" type="range" min="-0.3" max="0.3" step="0.01" value="0" />
          </label>
          <label>
            <span>Sweeps per frame <output id="potts-speed-out"></output></span>
            <input id="potts-speed" type="range" min="1" max="100" step="1" value="40" />
          </label>
        </section>

        <section id="group-growth">
          <h2>Growth from stones</h2>
          <label>
            <span>Neighbourhood radius <output id="growth-radius-out"></output></span>
            <input id="growth-radius" type="range" min="2" max="48" step="1" value="40" />
          </label>
        </section>

        <section id="group-friction">
          <h2>Friction</h2>
          <label>
            <span>Grip strength <output id="friction-out"></output></span>
            <input id="friction" type="range" min="0" max="1" step="0.05" value="1" />
          </label>
        </section>

        <section id="group-length">
          <h2>Fixed length</h2>
          <label>
            <span>Band length, in hull lengths <output id="length-out"></output></span>
            <input id="length" type="range" min="1" max="2.5" step="0.01" value="1.3" />
          </label>
        </section>

        <h2>General</h2>
        <label>
          <span>Wave start</span>
          <select id="start">
            <option value="rough">Rough edge</option>
            <option value="square">Straight edge</option>
            <option value="circle">Circle</option>
          </select>
        </label>
        <label>
          <span>Brush <output id="brush-out"></output></span>
          <input id="brush" type="range" min="1" max="20" step="1" value="7" />
        </label>
        <label class="check">
          <input id="show-hull" type="checkbox" checked />
          <span>Show convex hull</span>
        </label>

        <div class="buttons">
          <button id="restart">Restart the wave</button>
          <button id="pause">Pause</button>
          <button id="random">Random stones</button>
          <button id="clear">Clear stones</button>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
